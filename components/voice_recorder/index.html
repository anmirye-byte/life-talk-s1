<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: "Malgun Gothic", Arial, sans-serif; }
    .recorder { padding: 10px 0 14px; }
    button { align-items: center; background: linear-gradient(135deg, #ffae42, #f5c35b 53%, #4ec9b0); border: 0; border-radius: 22px; box-shadow: 0 7px 16px rgba(120, 100, 40, .18); color: #fff; cursor: pointer; display: flex; font: inherit; font-size: 25px; font-weight: 900; justify-content: center; letter-spacing: -.5px; min-height: 82px; padding: 14px 24px; transition: transform .18s ease, box-shadow .18s ease; width: 100%; }
    button:hover { box-shadow: 0 10px 20px rgba(120, 100, 40, .26); transform: translateY(-2px); }
    button:focus-visible { outline: 4px solid #183852; outline-offset: 3px; }
    button.recording { background: linear-gradient(135deg, #ef6b65, #e9486c); animation: pulse 1.1s infinite; }
    .icon { background: rgba(255,255,255,.22); border-radius: 50%; display: grid; height: 52px; margin-right: 14px; place-items: center; width: 52px; }
    svg { height: 32px; width: 32px; }
    .hint { color: #735d2d; font-size: 15px; font-weight: 700; margin-top: 9px; text-align: center; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(233, 72, 108, .18); } }
  </style>
</head>
<body>
  <div class="recorder">
    <button id="recordButton" type="button"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path></svg></span><span id="label">말하기 시작</span></button>
    <div class="hint" id="hint">버튼을 누른 뒤, 편하게 이야기해 주세요.</div>
  </div>
  <script>
    const button = document.getElementById('recordButton'), label = document.getElementById('label'), hint = document.getElementById('hint');
    let recorder, chunks = [], stream;
    const send = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*');
    const resize = () => send('streamlit:setFrameHeight', { height: document.body.scrollHeight });
    send('streamlit:componentReady', { apiVersion: 1 }); window.addEventListener('load', resize);
    function audioBufferToWav(buffer) { const channels = buffer.numberOfChannels, length = buffer.length * channels * 2, wav = new ArrayBuffer(44 + length), view = new DataView(wav), rate = buffer.sampleRate; const write = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0))); write(0, 'RIFF'); view.setUint32(4, 36 + length, true); write(8, 'WAVE'); write(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, channels, true); view.setUint32(24, rate, true); view.setUint32(28, rate * channels * 2, true); view.setUint16(32, channels * 2, true); view.setUint16(34, 16, true); write(36, 'data'); view.setUint32(40, length, true); const data = Array.from({length: channels}, (_, i) => buffer.getChannelData(i)); let o = 44; for (let s = 0; s < buffer.length; s++) for (let c = 0; c < channels; c++) { const v = Math.max(-1, Math.min(1, data[c][s])); view.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; } return wav; }
    async function finish() { const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'}), context = new (window.AudioContext || window.webkitAudioContext)(), decoded = await context.decodeAudioData(await blob.arrayBuffer()), bytes = new Uint8Array(audioBufferToWav(decoded)); let binary = ''; for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); send('streamlit:setComponentValue', {value: {id: Date.now(), audio_base64: btoa(binary), sample_rate: decoded.sampleRate, sample_width: 2}}); await context.close(); stream.getTracks().forEach(track => track.stop()); }
    button.addEventListener('click', async () => { if (recorder && recorder.state === 'recording') { recorder.stop(); button.classList.remove('recording'); label.textContent = '음성 확인 중'; hint.textContent = '잠시만 기다려 주세요.'; return; } try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); chunks = []; recorder = new MediaRecorder(stream); recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); }; recorder.onstop = () => finish().catch(() => { hint.textContent = '음성을 처리하지 못했어요. 다시 시도해 주세요.'; }); recorder.start(); button.classList.add('recording'); label.textContent = '말하기 종료'; hint.textContent = '녹음 중이에요. 끝나면 버튼을 다시 눌러 주세요.'; } catch (_) { hint.textContent = '마이크 사용을 허용한 뒤 다시 눌러 주세요.'; } });
  </script>
</body>
</html>
